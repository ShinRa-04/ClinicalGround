[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "health-harness"
version = "0.1.0"
description = "Case-isolated operational workflow harness"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
health-harness = "health_harness.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["health_harness*"]

[tool.setuptools.package-data]
health_harness = ["data/*.json"]
