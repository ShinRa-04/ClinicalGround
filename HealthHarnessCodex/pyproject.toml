[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "health-harness-codex"
version = "0.1.0"
description = "Case-isolated operational workflow harness"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
health-harness-codex = "health_harness_codex.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["health_harness_codex*"]

[tool.setuptools.package-data]
health_harness_codex = ["data/*.json"]
